<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: system-ui, sans-serif; padding: 12px; margin: 0; }
    label { font-size: 12px; font-weight: 600; display: block; margin-top: 8px; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; margin-top: 14px; padding: 8px; background: #07c160; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    button:hover { background: #06ad56; }
    #status { margin-top: 8px; font-size: 12px; color: green; text-align: center; }
  </style>
</head>
<body>
  <label for="apiKey">SiliconFlow API Key:</label>
  <input type="password" id="apiKey" placeholder="sk-..." />

  <label for="targetLang">Target Language:</label>
  <select id="targetLang">
    <option value="English">English</option>
    <option value="Spanish">Spanish</option>
    <option value="Japanese">Japanese</option>
    <option value="French">French</option>
    <option value="German">German</option>
  </select>

  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
